name = "brief"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Secrets (wrangler secret put, or .dev.vars locally). Never put them here:
# APP_PASSWORD, SESSION_KEY

[dev]
port = 8787
ip = "127.0.0.1"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "brief"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "brief-media"

[triggers]
crons = ["* * * * *"]
